plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def debugAiBackendBaseUrl = localProperties.getProperty("AI_BACKEND_BASE_URL", "http://127.0.0.1:8787")
def releaseAiBackendBaseUrl = localProperties.getProperty("AI_BACKEND_BASE_URL_RELEASE", "https://your-ai-backend.example.com")

android {
    namespace "com.sotaynauan.ai"
    compileSdk 35

    defaultConfig {
        applicationId "com.sotaynauan.ai"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "AI_BACKEND_BASE_URL", "\"${debugAiBackendBaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
        release {
            buildConfigField "String", "AI_BACKEND_BASE_URL", "\"${releaseAiBackendBaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    def camerax_version = "1.5.3"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.room:room-testing:2.6.1"
}
